name: Validate PR

# Universal PR gate — runs on every PR and every push to main, regardless of
# which paths changed. android-ci.yml and backend-ci.yml are path-filtered
# and skip entirely on PRs that only touch docs/scripts/root config; this
# workflow is the always-on safety net that becomes the required check.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Python syntax sanity check
        run: python -m py_compile $(find app -name "*.py")

      - name: Run backend test suite
        env:
          # Test-only secret — Settings requires jwt_secret_key with no default.
          JWT_SECRET_KEY: ci-test-secret-not-used-in-production
          # DEBUG=true is required by tests: enables fake firebase token auth
          # and disables per-endpoint production rate limits (tests would 429).
          DEBUG: "true"
        run: PYTHONPATH=. pytest -v --tb=short
